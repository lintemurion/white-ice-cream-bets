name: Deploy

# Deploys to Firebase on every push to main, or on demand from any branch (Actions > Deploy >
# Run workflow). A manual run from a branch deploys that branch to the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of interrupting an upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless Google Cloud auth (Workload Identity Federation)
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      VITE_ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      VITE_USE_EMULATOR: 'false'
    steps:
      - name: Check required variables
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for name in FIREBASE_PROJECT_ID FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_AUTH_DOMAIN ADMIN_EMAIL WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # Early checks, so a bad config fails here with a clear step name. firebase deploy then
      # rebuilds and re-checks the bundle it uploads (firebase.json hosting.predeploy).
      - run: npm run rules

      - run: npm run build

      - run: npm run check-bundle

      - run: npx firebase deploy --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
