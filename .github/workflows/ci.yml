name: CI

# Tests and build. Runs on every pull request, and is called by deploy.yml before each deploy.
# Never requests cloud credentials.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Firestore emulator in firebase-tools 15 needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm test

      - run: npm run build
